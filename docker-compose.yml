version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: metrics-explorer-db
    environment:
      POSTGRES_USER: metrics_user
      POSTGRES_PASSWORD: metrics_password
      POSTGRES_DB: metrics_explorer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics_user -d metrics_explorer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Metrics Explorer Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrics-explorer-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://metrics_user:metrics_password@postgres:5432/metrics_explorer
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: INFO
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Prometheus (for local testing)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: metrics-explorer-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # Grafana (for local testing)
  grafana:
    image: grafana/grafana:10.2.2
    container_name: metrics-explorer-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
